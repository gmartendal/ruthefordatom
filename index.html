<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelo Atômico de Rutherford 3D</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #111, #000);
}

canvas {
    display: block;
}
</style>
</head>
<body>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.166.1/build/three.module.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.z = 10;

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* Luzes */

const ambient = new THREE.AmbientLight(0xffffff, 1);
scene.add(ambient);

const pointLight = new THREE.PointLight(0xffffff, 5);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

/* Núcleo */

const nucleusGeometry = new THREE.SphereGeometry(1, 64, 64);

const nucleusMaterial = new THREE.MeshStandardMaterial({
    color: 0xff3333,
    emissive: 0xaa0000,
    emissiveIntensity: 1
});

const nucleus = new THREE.Mesh(
    nucleusGeometry,
    nucleusMaterial
);

scene.add(nucleus);

/* Grupo do átomo */

const atomGroup = new THREE.Group();
scene.add(atomGroup);

const electronGroups = [];

function createOrbit(radius, color, rotationX, rotationY, speed){

    const orbitGroup = new THREE.Group();

    orbitGroup.rotation.x = rotationX;
    orbitGroup.rotation.y = rotationY;

    const orbitGeometry =
        new THREE.TorusGeometry(radius, 0.02, 16, 200);

    const orbitMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.4
        });

    const orbit =
        new THREE.Mesh(orbitGeometry, orbitMaterial);

    orbitGroup.add(orbit);

    const electronGeometry =
        new THREE.SphereGeometry(0.15, 32, 32);

    const electronMaterial =
        new THREE.MeshStandardMaterial({
            color: color,
            emissive: color,
            emissiveIntensity: 2
        });

    const electron =
        new THREE.Mesh(
            electronGeometry,
            electronMaterial
        );

    electron.position.x = radius;

    orbitGroup.add(electron);

    atomGroup.add(orbitGroup);

    electronGroups.push({
        electron,
        radius,
        angle: Math.random() * Math.PI * 2,
        speed
    });
}

createOrbit(
    2.5,
    0x00ffff,
    0,
    0,
    0.03
);

createOrbit(
    3.2,
    0x00aaff,
    Math.PI / 2,
    0,
    0.02
);

createOrbit(
    3.8,
    0x66ffff,
    Math.PI / 4,
    Math.PI / 4,
    0.015
);

createOrbit(
    4.5,
    0x88ffff,
    -Math.PI / 3,
    Math.PI / 6,
    0.01
);

/* Estrelas */

const starGeometry =
    new THREE.BufferGeometry();

const starCount = 2000;
const positions = [];

for(let i = 0; i < starCount; i++){

    positions.push(
        (Math.random()-0.5)*200,
        (Math.random()-0.5)*200,
        (Math.random()-0.5)*200
    );
}

starGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
        positions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        size: 0.15
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);

/* Animação */

function animate(){

    requestAnimationFrame(animate);

    atomGroup.rotation.y += 0.004;
    atomGroup.rotation.x += 0.0015;

    electronGroups.forEach(data => {

        data.angle += data.speed;

        data.electron.position.x =
            Math.cos(data.angle) * data.radius;

        data.electron.position.y =
            Math.sin(data.angle) * data.radius;
    });

    nucleus.rotation.y += 0.01;

    renderer.render(scene, camera);
}

animate();

/* Responsivo */

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>

</body>
</html>
